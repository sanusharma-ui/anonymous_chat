<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowChat - Modern Anonymous Chat</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Landing Screen -->
    <div id="landing" class="screen active">
        <div class="logo">
            <h1>ShadowChat</h1>
            <p>Anonymous chats, powered by. Clean, fun, and safe.</p>
        </div>
        <div class="options">
            <button id="random-chat" class="btn-primary">Random Chat</button>
            <button id="create-room" class="btn-secondary">Create Private Room</button>
            <div class="or-divider">or</div>
            <div class="input-group">
                <input type="text" id="join-room" placeholder="Enter Room ID to Join" maxlength="36">
                <button id="join-btn" class="btn-primary">Join</button>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat" class="screen">
        <header class="chat-header">
            <div class="status">
                <span id="partner-status">Connecting...</span>
            </div>
            <button id="back-btn" class="back-icon">←</button>
            <button id="next-btn" class="next-icon" style="display: none;">↻</button>
        </header>
        <div id="messages" class="messages-container"></div>
        <div class="message-input-container">
            <div class="input-wrapper">
                <input type="text" id="message-input" placeholder="Type a message..." maxlength="500">
                <button id="send-btn" class="send-btn">→</button>
            </div>
            <div id="message-status" class="status-text"></div>
        </div>
    </div>

    <!-- Waiting Screen Overlay -->
    <div id="waiting-overlay" class="overlay active">
        <div class="waiting-content">
            <div class="spinner"></div>
            <p id="waiting-text">Finding a chat partner...</p>
        </div>
    </div>

    <!-- Room Created Modal -->
    <div id="room-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Room Created!</h2>
            <p>Share this link with your friend:</p>
            <input type="text" id="room-link" readonly>
            <button id="copy-link" class="btn-primary">Copy Link</button>
            <button id="close-modal" class="btn-secondary">Close</button>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="error-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Oops!</h2>
            <p id="error-text"></p>
            <button id="ok-btn" class="btn-primary">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
